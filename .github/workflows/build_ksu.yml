name: Build Note 9 OneUI 2.5 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm binutils-aarch64-linux-gnu device-tree-compiler

      - name: Print Official Apollo Build Script
        run: |
          echo "=== Apollo directory ==="
          ls -la Apollo/
          echo "=== Apollo scripts ==="
          head -n 200 Apollo/*.sh 2>/dev/null || true

      - name: Setup Android Binutils 4.9
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc_toolchain

      - name: Patch Header Conflicts
        run: |
          python3 -c '
          import re
          with open("include/linux/bpf.h", "r") as f:
              content = f.read()
          pattern = r"static inline int __bpf_prog_charge\(.*?\}\s*static inline void __bpf_prog_uncharge\(.*?\}"
          matches = list(re.finditer(pattern, content, re.DOTALL))
          if len(matches) >= 2:
              second = matches[1]
              content = content[:second.start()] + content[second.end():]
              with open("include/linux/bpf.h", "w") as f:
                  f.write(content)

          with open("include/linux/exynos-ss.h", "r") as f:
              ss = f.read()
          ss = re.sub(r"^#define\s+s3c2410wdt_set_emergency_reset\(.*$", "// patched", ss, flags=re.MULTILINE)
          with open("include/linux/exynos-ss.h", "w") as f:
              f.write(ss)
          '

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PLATFORM_VERSION=10
          export CROSS_COMPILE=$(pwd)/gcc_toolchain/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          SPINLOCK_PATH=$(find . -path "*/kernel/spinlock.h" | grep -v "^./include/kernel" | head -n 1)
          EXTRA_INC=""
          if [ -n "$SPINLOCK_PATH" ]; then
            INC_BASE=$(dirname $(dirname "$SPINLOCK_PATH"))
            EXTRA_INC="-I$(pwd)/$INC_BASE"
          fi

          # استخدام Linker أندرويد 4.9 صراحة عبر -fuse-ld
          export LDFLAGS="-fuse-ld=$(pwd)/gcc_toolchain/bin/aarch64-linux-android-ld"

          make HOSTCC=gcc HOSTLD=ld CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 crownlte_defconfig

          scripts/config -e MIGRATION
          scripts/config -e COMPACTION
          scripts/config -e KSU
          scripts/config -e KPROBES
          scripts/config -e HAVE_KPROBES
          scripts/config -e KPROBE_EVENTS

          make HOSTCC=gcc HOSTLD=ld CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 olddefconfig
          make -j$(nproc) HOSTCC=gcc HOSTLD=ld CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 KCFLAGS="$EXTRA_INC" Image
