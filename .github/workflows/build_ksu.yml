name: Build Note 9 OneUI 2.5 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm binutils-aarch64-linux-gnu

      - name: Fix Duplicate BPF Functions in Header
        run: |
          python3 -c '
          import re
          with open("include/linux/bpf.h", "r") as f:
              content = f.read()
          pattern = r"static inline int __bpf_prog_charge\(.*?\}\s*static inline void __bpf_prog_uncharge\(.*?\}"
          matches = list(re.finditer(pattern, content, re.DOTALL))
          if len(matches) >= 2:
              second = matches[1]
              content = content[:second.start()] + content[second.end():]
              with open("include/linux/bpf.h", "w") as f:
                  f.write(content)
              print("Successfully removed the second duplicate BPF block.")
          '

      - name: Inspect Repo Build Scripts and Configs
        run: |
          ls -la
          ls -la arch/arm64/configs/*crown* arch/arm64/configs/*exynos9810* 2>/dev/null || true
          head -n 120 build*.sh 2>/dev/null || true

      - name: Configure and Build Kernel with Repo Configs
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PLATFORM_VERSION=10
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # استخدام ملف إعدادات exynos9810-crownlte_defconfig الكامل إن وجد
          if [ -f "arch/arm64/configs/exynos9810-crownlte_defconfig" ]; then
            DEFCONFIG="exynos9810-crownlte_defconfig"
          else
            DEFCONFIG="crownlte_defconfig"
          fi
          echo "Selected defconfig: $DEFCONFIG"

          make CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 $DEFCONFIG

          # دمج إعدادات OneUI أو KSU الفرعية إن وجدت في مجلد configs
          for cfg in arch/arm64/configs/*oneui* arch/arm64/configs/*ksu*; do
            if [ -f "$cfg" ]; then
              echo "Merging config fragment: $cfg"
              scripts/kconfig/merge_config.sh -m .config "$cfg"
            fi
          done

          # تفعيل KernelSU-Next و Kprobes
          scripts/config -e KSU
          scripts/config -e KPROBES
          scripts/config -e HAVE_KPROBES
          scripts/config -e KPROBE_EVENTS

          make CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 olddefconfig
          make -j$(nproc) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 Image

      - name: Upload Compiled Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: crownlte-ksu-Image
          path: arch/arm64/boot/Image
