name: Build Note 9 OneUI 2.5 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm binutils-aarch64-linux-gnu

      - name: Inspect Official Build Scripts and Headers
        run: |
          echo "=== Files in root & Apollo ==="
          ls -la
          ls -la Apollo/ 2>/dev/null || true
          echo "=== Build script contents ==="
          cat Apollo/*.sh 2>/dev/null || true
          cat build*.sh 2>/dev/null || true
          echo "=== Location of spinlock.h ==="
          find . -path "*kernel/spinlock.h"
          echo "=== Defconfigs ==="
          find arch/arm64/configs -maxdepth 2 -type f

      - name: Patch Header Conflicts
        run: |
          python3 -c '
          import re
          with open("include/linux/bpf.h", "r") as f:
              content = f.read()
          pattern = r"static inline int __bpf_prog_charge\(.*?\}\s*static inline void __bpf_prog_uncharge\(.*?\}"
          matches = list(re.finditer(pattern, content, re.DOTALL))
          if len(matches) >= 2:
              second = matches[1]
              content = content[:second.start()] + content[second.end():]
              with open("include/linux/bpf.h", "w") as f:
                  f.write(content)

          with open("include/linux/exynos-ss.h", "r") as f:
              ss = f.read()
          ss = re.sub(r"^#define\s+s3c2410wdt_set_emergency_reset\(.*$", "// patched", ss, flags=re.MULTILINE)
          with open("include/linux/exynos-ss.h", "w") as f:
              f.write(ss)
          '

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PLATFORM_VERSION=10
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # إيجاد المجلد الأب الذي يحتوي على kernel/spinlock.h
          SPINLOCK_PATH=$(find . -path "*/kernel/spinlock.h" | grep -v "^./include/kernel" | head -n 1)
          EXTRA_INC=""
          if [ -n "$SPINLOCK_PATH" ]; then
            INC_BASE=$(dirname $(dirname "$SPINLOCK_PATH"))
            echo "Found pwrcal include base: $INC_BASE"
            EXTRA_INC="-I$(pwd)/$INC_BASE"
          fi

          # تعطيل LTO_CLANG إن كان يسبب تمرير -f للرابط
          make CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 crownlte_defconfig

          scripts/config -e KSU
          scripts/config -e KPROBES
          scripts/config -e HAVE_KPROBES
          scripts/config -e KPROBE_EVENTS
          scripts/config -d LTO_CLANG
          scripts/config -d THINLTO

          make CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 olddefconfig
          make -j$(nproc) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 KCFLAGS="$EXTRA_INC" Image

      - name: Upload Compiled Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: crownlte-ksu-Image
          path: arch/arm64/boot/Image
