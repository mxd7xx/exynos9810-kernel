name: Build Note 9 OneUI 2.5 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm

      - name: Setup GCC 4.9 (for Cross-Binutils)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc_toolchain

      - name: Configure and Build Kernel with Clang
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export CROSS_COMPILE=$(pwd)/gcc_toolchain/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # فحص إذا كان المستودع يحتوي على Clang مدمج في مجلد toolchain
          if [ -d "$(pwd)/toolchain/clang" ]; then
            export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          fi

          make CC=clang crownlte_defconfig
          
          # تفعيل KernelSU-Next و Kprobes
          scripts/config -e KSU
          scripts/config -e KPROBES
          scripts/config -e HAVE_KPROBES
          scripts/config -e KPROBE_EVENTS
          
          make CC=clang olddefconfig
          make -j$(nproc) CC=clang Image

      - name: Upload Compiled Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: crownlte-ksu-Image
          path: arch/arm64/boot/Image
