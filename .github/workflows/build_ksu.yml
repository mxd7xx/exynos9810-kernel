name: Build Note 9 OneUI 2.5 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm binutils-aarch64-linux-gnu

      - name: Patch Header Conflicts
        run: |
          python3 -c '
          import re
          with open("include/linux/bpf.h", "r") as f:
              content = f.read()
          pattern = r"static inline int __bpf_prog_charge\(.*?\}\s*static inline void __bpf_prog_uncharge\(.*?\}"
          matches = list(re.finditer(pattern, content, re.DOTALL))
          if len(matches) >= 2:
              second = matches[1]
              content = content[:second.start()] + content[second.end():]
              with open("include/linux/bpf.h", "w") as f:
                  f.write(content)
              print("Patched include/linux/bpf.h")

          with open("include/linux/exynos-ss.h", "r") as f:
              ss = f.read()
          ss = re.sub(r"^#define\s+s3c2410wdt_set_emergency_reset\(.*$", "// patched", ss, flags=re.MULTILINE)
          with open("include/linux/exynos-ss.h", "w") as f:
              f.write(ss)
          print("Patched include/linux/exynos-ss.h")
          '

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PLATFORM_VERSION=10
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # استخدام Clang + LLVM_IAS=1 (لحل exynos-m3) مع ترك LD الافتراضي لـ aarch64-linux-gnu-ld (لحل -r)
          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 crownlte_defconfig

          # تفعيل KernelSU-Next و Kprobes
          scripts/config -e KSU
          scripts/config -e KPROBES
          scripts/config -e HAVE_KPROBES
          scripts/config -e KPROBE_EVENTS

          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 olddefconfig
          make -j$(nproc) CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 KCFLAGS="-I$(pwd)/include/linux" Image

      - name: Upload Compiled Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: crownlte-ksu-Image
          path: arch/arm64/boot/Image
